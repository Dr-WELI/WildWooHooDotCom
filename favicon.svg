<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="WildWooHoo">
  <title>WildWooHoo favicon - Mirror W with rainbow reflection plane</title>
  <defs>
    <linearGradient id="f-sp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8493B"/>
      <stop offset="18%" stop-color="#F08A30"/>
      <stop offset="38%" stop-color="#F5C545"/>
      <stop offset="58%" stop-color="#6AB04A"/>
      <stop offset="78%" stop-color="#3D7EE0"/>
      <stop offset="100%" stop-color="#6B4FB8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#050805"/>
  <text x="50" y="44" text-anchor="middle"
        font-family="'DM Serif Display','Libre Baskerville',Georgia,'Times New Roman',serif"
        font-weight="400" font-size="56" letter-spacing="-1.5"
        fill="#FBF7EE">W</text>
  <line x1="14" y1="50" x2="86" y2="50"
        stroke="url(#f-sp)" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(0 100) scale(1 -1)">
    <text x="50" y="44" text-anchor="middle"
          font-family="'DM Serif Display','Libre Baskerville',Georgia,'Times New Roman',serif"
          font-weight="400" font-size="56" letter-spacing="-1.5"
          fill="#FBF7EE" opacity="0.55">W</text>
  </g>
</svg>
