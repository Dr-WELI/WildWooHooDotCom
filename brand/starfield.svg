<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Southern Cross over savanna at night">
  <title>WildWooHoo - night savanna sky</title>
  <defs>
    <!-- Night sky: black at top fading into deep forest/savanna green at the lower band, then pure black at the ground. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#050805"/>
      <stop offset="25%" stop-color="#0A1208"/>
      <stop offset="55%" stop-color="#0F1A0C"/>
      <stop offset="78%" stop-color="#152110"/>
      <stop offset="92%" stop-color="#0A1006"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <!-- Faint savanna-gold horizon glow, picks up the warmth from the photography below -->
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#DD843F" stop-opacity="0"/>
      <stop offset="55%" stop-color="#DD843F" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#915C4B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FBF7EE" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FBF7EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FBF7EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="560" width="1600" height="340" fill="url(#horizonGlow)"/>

  <!-- Ambient stars concentrated in upper two-thirds -->
  <g fill="#FBF7EE">
    <circle cx="80"   cy="60"  r="0.7" opacity="0.55"/>
    <circle cx="180"  cy="120" r="1.1" opacity="0.65"/>
    <circle cx="240"  cy="220" r="0.8" opacity="0.5"/>
    <circle cx="320"  cy="80"  r="0.9" opacity="0.6"/>
    <circle cx="440"  cy="180" r="0.6" opacity="0.4"/>
    <circle cx="520"  cy="60"  r="1.3" opacity="0.7"/>
    <circle cx="600"  cy="160" r="0.7" opacity="0.5"/>
    <circle cx="700"  cy="240" r="0.9" opacity="0.6"/>
    <circle cx="800"  cy="100" r="0.5" opacity="0.4"/>
    <circle cx="880"  cy="200" r="1.0" opacity="0.6"/>
    <circle cx="960"  cy="40"  r="0.8" opacity="0.55"/>
    <circle cx="1040" cy="260" r="0.7" opacity="0.5"/>
    <circle cx="1160" cy="120" r="1.2" opacity="0.65"/>
    <circle cx="1300" cy="80"  r="0.6" opacity="0.4"/>
    <circle cx="1420" cy="180" r="0.9" opacity="0.6"/>
    <circle cx="1520" cy="60"  r="0.7" opacity="0.5"/>
    <circle cx="140"  cy="320" r="0.8" opacity="0.55"/>
    <circle cx="280"  cy="380" r="0.6" opacity="0.4"/>
    <circle cx="420"  cy="460" r="1.1" opacity="0.45"/>
    <circle cx="540"  cy="320" r="0.7" opacity="0.5"/>
    <circle cx="680"  cy="380" r="0.5" opacity="0.35"/>
    <circle cx="780"  cy="440" r="0.9" opacity="0.45"/>
    <circle cx="920"  cy="300" r="0.8" opacity="0.55"/>
    <circle cx="1060" cy="420" r="0.6" opacity="0.4"/>
    <circle cx="1180" cy="380" r="1.0" opacity="0.55"/>
    <circle cx="1340" cy="320" r="0.7" opacity="0.5"/>
    <circle cx="1480" cy="440" r="0.5" opacity="0.4"/>
  </g>

  <!-- Southern Cross - small, discreet -->
  <g transform="translate(1320, 220)">
    <g stroke="#FBF7EE" stroke-width="0.4" opacity="0.10" fill="none">
      <line x1="4"   y1="-66" x2="-9"  y2="84"/>
      <line x1="-55" y1="16"  x2="42"  y2="-4"/>
    </g>
    <circle cx="4"   cy="-66" r="6"   fill="url(#starGlow)"/>
    <circle cx="4"   cy="-66" r="1.7" fill="#FBF7EE"/>
    <circle cx="-55" cy="16"  r="7"   fill="url(#starGlow)"/>
    <circle cx="-55" cy="16"  r="2.0" fill="#FBF7EE"/>
    <circle cx="42"  cy="-4"  r="5"   fill="url(#starGlow)"/>
    <circle cx="42"  cy="-4"  r="1.4" fill="#FBF7EE"/>
    <circle cx="-9"  cy="84"  r="9"   fill="url(#starGlow)"/>
    <circle cx="-9"  cy="84"  r="2.5" fill="#FBF7EE"/>
    <circle cx="-22" cy="48"  r="4"   fill="url(#starGlow)"/>
    <circle cx="-22" cy="48"  r="0.9" fill="#FBF7EE"/>
  </g>
</svg>
