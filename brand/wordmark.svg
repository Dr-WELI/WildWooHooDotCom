<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="WildWooHoo">
  <title>WildWooHoo wordmark</title>
  <desc>WildWooHoo set in Big Shoulders Display Black - the closest free typeface to the custom W in the monogram. Diagonal cut splits the word into two halves at rest; on hover a rainbow zipper sweeps left to right, a white sunbeam follows, and the halves slide together into one solid unified wordmark.</desc>
  <defs>
    <linearGradient id="wm-sp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C97A66"/>
      <stop offset="18%"  stop-color="#D89E78"/>
      <stop offset="36%"  stop-color="#E5B96D"/>
      <stop offset="50%"  stop-color="#27A05B"/>
      <stop offset="64%"  stop-color="#B07F30"/>
      <stop offset="82%"  stop-color="#9985A8"/>
      <stop offset="100%" stop-color="#7D6E92"/>
    </linearGradient>
    <filter id="wm-fl" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="wm-cut-above">
      <polygon points="0,0 720,0 720,55 0,105"/>
    </clipPath>
    <clipPath id="wm-cut-below">
      <polygon points="0,121 720,71 720,160 0,160"/>
    </clipPath>
  </defs>

  <!-- Top half - clipped above the diagonal, sits at +2px refraction offset at rest -->
  <g class="wwh-wm-top">
    <text x="364" y="128" text-anchor="middle"
          font-family="'Big Shoulders Display','Saira','Archivo Black',Impact,sans-serif"
          font-weight="900" font-size="120" letter-spacing="-2"
          fill="currentColor"
          clip-path="url(#wm-cut-above)">WildWooHoo</text>
  </g>

  <!-- Bottom half - clipped below the diagonal, sits at -2px refraction offset at rest -->
  <g class="wwh-wm-bot">
    <text x="356" y="128" text-anchor="middle"
          font-family="'Big Shoulders Display','Saira','Archivo Black',Impact,sans-serif"
          font-weight="900" font-size="120" letter-spacing="-2"
          fill="currentColor"
          clip-path="url(#wm-cut-below)">WildWooHoo</text>
  </g>

  <!-- White sunbeam - sweeps across the cut on hover -->
  <line class="wwh-wm-sunbeam"
        x1="-40" y1="118" x2="760" y2="58"
        stroke="#FFF7D8" stroke-width="18" stroke-linecap="round"
        opacity="0" filter="url(#wm-fl)"/>

  <!-- Rainbow zipper - dashed line that animates via stroke-dashoffset -->
  <line class="wwh-wm-beam"
        x1="0" y1="113" x2="720" y2="63"
        stroke="url(#wm-sp)" stroke-width="10" stroke-linecap="round"
        opacity="0" stroke-dasharray="220 522" stroke-dashoffset="220"/>

  <!-- Bright spark riding the leading edge of the zipper -->
  <g class="wwh-wm-spark">
    <circle cx="0" cy="113" r="9" fill="#FFFAE0"/>
  </g>

  <!-- Solid unified wordmark - fades in as the zipper finishes, erasing the cut -->
  <g class="wwh-wm-full">
    <text x="360" y="128" text-anchor="middle"
          font-family="'Big Shoulders Display','Saira','Archivo Black',Impact,sans-serif"
          font-weight="900" font-size="120" letter-spacing="-2"
          fill="currentColor">WildWooHoo</text>
  </g>
</svg>
