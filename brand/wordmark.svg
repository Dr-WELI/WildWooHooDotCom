<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="WildWooHoo">
  <title>WildWooHoo wordmark</title>
  <desc>Custom wordmark with a diagonal cut. The letters above and below the cut are offset (refraction). A thin rainbow beam runs through the diagonal gap — invisible at rest, revealed by the brand-effects script on click.</desc>
  <defs>
    <linearGradient id="wwh-spectrum" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8493B"/>
      <stop offset="18%" stop-color="#F08A30"/>
      <stop offset="38%" stop-color="#F5C545"/>
      <stop offset="58%" stop-color="#6AB04A"/>
      <stop offset="78%" stop-color="#3D7EE0"/>
      <stop offset="100%" stop-color="#6B4FB8"/>
    </linearGradient>
    <clipPath id="wwh-cut-above">
      <polygon points="0,0 720,0 720,55 0,105"/>
    </clipPath>
    <clipPath id="wwh-cut-below">
      <polygon points="0,121 720,71 720,160 0,160"/>
    </clipPath>
  </defs>

  <!-- Upper half — monochrome, shifted slightly right -->
  <g class="wwh-wm-top">
    <text x="364" y="130" text-anchor="middle"
          font-family="'DM Serif Display','Libre Baskerville',Georgia,'Times New Roman',serif"
          font-weight="400" font-size="128" letter-spacing="-3"
          fill="currentColor"
          clip-path="url(#wwh-cut-above)">WildWooHoo</text>
  </g>

  <!-- Lower half — monochrome, shifted slightly left -->
  <g class="wwh-wm-bot">
    <text x="356" y="130" text-anchor="middle"
          font-family="'DM Serif Display','Libre Baskerville',Georgia,'Times New Roman',serif"
          font-weight="400" font-size="128" letter-spacing="-3"
          fill="currentColor"
          clip-path="url(#wwh-cut-below)">WildWooHoo</text>
  </g>

  <!-- Beam: a clean rainbow LINE through the diagonal gap.
       Invisible at rest; brand-effects animates opacity + stroke-width on burst. -->
  <line class="wwh-wm-beam"
        x1="0" y1="113" x2="720" y2="63"
        stroke="url(#wwh-spectrum)" stroke-width="8" stroke-linecap="round"
        opacity="0"/>
</svg>
