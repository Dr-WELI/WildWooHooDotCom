<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" role="img" aria-label="WildWooHoo">
  <title>WildWooHoo wordmark</title>
  <desc>WildWooHoo drawn as outlined geometric monoline letters. Every letter shows two parallel hairlines tracing the borders of a thick stroke - the AWAL-style hollow outline. W and H share heavy stroke (verticals 150 apart so H occupies the same visual space as W); i, l, d, o use a lighter stroke. The interior of every letter is transparent so background images read through.</desc>
  <defs>
    <linearGradient id="wm-shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C97A66" stop-opacity="0"/>
      <stop offset="14%"  stop-color="#C97A66" stop-opacity=".42"/>
      <stop offset="28%"  stop-color="#D89E78" stop-opacity=".48"/>
      <stop offset="42%"  stop-color="#E5B96D" stop-opacity=".50"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset="58%"  stop-color="#27A05B" stop-opacity=".50"/>
      <stop offset="72%"  stop-color="#B07F30" stop-opacity=".48"/>
      <stop offset="86%"  stop-color="#9985A8" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#7D6E92" stop-opacity="0"/>
    </linearGradient>

    <!-- Outline mask: outer stroke painted, then inner stroke "cut out".
         The difference is a thin double-line outline along every stroke. -->
    <mask id="wm-outline" maskUnits="userSpaceOnUse">
      <rect width="880" height="160" fill="white"/>
      <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 29 55 L 66.5 120 L 109 65 L 151.5 120 L 189 55" stroke-width="15"/>
        <line x1="211" y1="70" x2="211" y2="120" stroke-width="7"/>
        <line x1="229" y1="55" x2="229" y2="120" stroke-width="7"/>
        <circle cx="263" cy="95" r="18" stroke-width="7"/>
        <line x1="288" y1="55" x2="288" y2="120" stroke-width="7"/>
        <path d="M 312.5 55 L 350 120 L 392.5 65 L 435 120 L 477.5 55" stroke-width="15"/>
        <circle cx="516" cy="95" r="18" stroke-width="7"/>
        <circle cx="561" cy="95" r="18" stroke-width="7"/>
        <line x1="601" y1="55" x2="601" y2="120" stroke-width="15"/>
        <line x1="751" y1="55" x2="751" y2="120" stroke-width="15"/>
        <line x1="601" y1="87" x2="751" y2="87" stroke-width="15"/>
        <circle cx="797" cy="95" r="18" stroke-width="7"/>
        <circle cx="841" cy="95" r="18" stroke-width="7"/>
      </g>
    </mask>
  </defs>

  <!-- Outer strokes - the mask leaves only the outline ring visible -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" mask="url(#wm-outline)">
    <path d="M 29 55 L 66.5 120 L 109 65 L 151.5 120 L 189 55" stroke-width="22"/>
    <line x1="211" y1="70" x2="211" y2="120" stroke-width="14"/>
    <line x1="229" y1="55" x2="229" y2="120" stroke-width="14"/>
    <circle cx="263" cy="95" r="18" stroke-width="14"/>
    <line x1="288" y1="55" x2="288" y2="120" stroke-width="14"/>
    <path d="M 312.5 55 L 350 120 L 392.5 65 L 435 120 L 477.5 55" stroke-width="22"/>
    <circle cx="516" cy="95" r="18" stroke-width="14"/>
    <circle cx="561" cy="95" r="18" stroke-width="14"/>
    <line x1="601" y1="55" x2="601" y2="120" stroke-width="22"/>
    <line x1="751" y1="55" x2="751" y2="120" stroke-width="22"/>
    <line x1="601" y1="87" x2="751" y2="87" stroke-width="22"/>
    <circle cx="797" cy="95" r="18" stroke-width="14"/>
    <circle cx="841" cy="95" r="18" stroke-width="14"/>
  </g>

  <!-- i dot (the only filled element) -->
  <circle cx="211" cy="58" r="5" fill="currentColor"/>

  <!-- Rainbow shine - sweeps across on hover -->
  <g class="wwh-wm-shine">
    <rect x="-100" y="-10" width="120" height="180" fill="url(#wm-shine-grad)" transform="rotate(12 -40 80)"/>
  </g>
</svg>
