<!doctype html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Libre Baskerville",Georgia,serif;background:#C5DFC3;color:#0C0E0F;display:flex;align-items:center;justify-content:center;padding:60px}
.card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:24px;background:#C5DFC3;background-image:radial-gradient(ellipse at 88% 12%,rgba(229,185,109,.18) 0%,transparent 56%),radial-gradient(ellipse at 12% 88%,rgba(39,160,91,.12) 0%,transparent 60%)}
.mark{height:240px;width:auto;filter:drop-shadow(0 18px 30px rgba(7,32,24,.18))}
h1{font-size:56px;letter-spacing:-0.01em;font-weight:700;line-height:1}
.tag{font-style:italic;font-family:"Instrument Serif",serif;font-size:24px;color:#5E5F63}
.square .mark{height:300px}
.square h1{font-size:48px}
.rect h1{font-size:62px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/wwh-brand-tokens.css?v=20260616z-tech" />
  <link rel="stylesheet" href="/wwh-darkmode.css?v=20260801a" />
</head>
<body>
<div class="card rect">
<img src="../logos/monogram-rainbow.svg" class="mark">
<h1>WildWooHoo</h1>
<div class="tag">The animal kingdom — including us</div>
</div>
</body>
</html>
