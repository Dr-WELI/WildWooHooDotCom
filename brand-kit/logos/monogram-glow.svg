<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="WildWooHoo W monogram - glow">
  <title>WildWooHoo - Mirror W monogram (glow variant)</title>
  <desc>Black horizon-pinched tile with a single cream W centred on the horizon, wrapped in a soft white-into-rainbow halo bloom. This is the final-frame resting state of the rainbow logo animation, drawn as a static asset. The W is framed at ~50% of the tile width (stroke 7, outer extent reaching x=21.5-78.5 / y=36.5-63.5) so its furthest visible pixel sits ~31.5 units from centre — inside the inscribed profile-circle (radius 50), the iOS squircle, and crucially Android adaptive's inner 66.67% safe zone (radius 30.5). The bloom is allowed to extend further so the icon reads luminous when not cropped.</desc>
  <defs>
    <!-- Tile body: deep ink so the halo reads cleanly. -->
    <radialGradient id="mg-body" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#1A1A1B"/>
      <stop offset="55%"  stop-color="#0E0E0F"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Halo bloom: cream core, fading through warm tones, a hint of full
         spectrum at the outer fall-off, then to transparent. -->
    <radialGradient id="mg-halo" cx="50%" cy="50%" r="58%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="14%"  stop-color="#FBF7EE" stop-opacity=".38"/>
      <stop offset="28%"  stop-color="#E5B96D" stop-opacity=".22"/>
      <stop offset="44%"  stop-color="#C97A66" stop-opacity=".14"/>
      <stop offset="62%"  stop-color="#9985A8" stop-opacity=".10"/>
      <stop offset="80%"  stop-color="#27A05B" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#0E0E0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Top highlight + bottom shadow keep the tile dimensional. -->
    <radialGradient id="mg-spec" cx="32%" cy="22%" r="55%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mg-shadow" cx="78%" cy="82%" r="55%">
      <stop offset="0%"  stop-color="#000000" stop-opacity=".24"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tile shape: AWAL-style horizon-pinched rounded square. -->
    <clipPath id="mg-tile">
      <path d="M 24 4 H 76 C 92 4, 96 8, 96 24 V 46 C 96 48, 94.5 49.2, 92 50 C 94.5 50.8, 96 52, 96 54 V 76 C 96 92, 92 96, 76 96 H 24 C 8 96, 4 92, 4 76 V 54 C 4 52, 5.5 50.8, 8 50 C 5.5 49.2, 4 48, 4 46 V 24 C 4 8, 8 4, 24 4 Z"/>
    </clipPath>

    <!-- Soft outer glow for the W itself: blurred duplicate behind the
         crisp stroke. stdDeviation tuned so the bloom reads at 16px and
         doesn't smear at 2048px. -->
    <filter id="mg-w-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <g clip-path="url(#mg-tile)">
    <rect width="100" height="100" fill="url(#mg-body)"/>
    <rect width="100" height="100" fill="url(#mg-halo)"/>
    <rect width="100" height="100" fill="url(#mg-spec)"/>
    <rect width="100" height="100" fill="url(#mg-shadow)"/>

    <!-- Blurred W: provides the radiant glow around the strokes. -->
    <path d="M 25 40 L 36.7 60 L 50 42.7 L 63.3 60 L 75 40"
          stroke="#FFFFFF" stroke-width="8" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          opacity=".7" filter="url(#mg-w-glow)"/>

    <!-- Crisp single W on top. Scaled to ~50% of tile width so circle
         crops (incl. Android adaptive 66.67% safe zone) preserve the
         symbol with comfortable margin. -->
    <path d="M 25 40 L 36.7 60 L 50 42.7 L 63.3 60 L 75 40"
          stroke="#FBF7EE" stroke-width="7" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 1px outer hairline at the tile edge for crispness against light bgs. -->
  <path d="M 24 4 H 76 C 92 4, 96 8, 96 24 V 46 C 96 48, 94.5 49.2, 92 50 C 94.5 50.8, 96 52, 96 54 V 76 C 96 92, 92 96, 76 96 H 24 C 8 96, 4 92, 4 76 V 54 C 4 52, 5.5 50.8, 8 50 C 5.5 49.2, 4 48, 4 46 V 24 C 4 8, 8 4, 24 4 Z"
        fill="none" stroke="rgba(255,255,255,.06)" stroke-width=".5"/>
</svg>
