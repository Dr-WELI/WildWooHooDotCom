<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Southern Cross overlay">
  <title>WildWooHoo - star overlay (sits above showreel)</title>
  <desc>Transparent-background star layer rendered on top of the showreel imagery in the splash hero so the Southern Cross + a sparse sprinkling of supporting stars are always visible no matter what photograph is currently scrolling underneath. Halo gradients + bright white cores so each star reads even at small render sizes.</desc>
  <defs>
    <radialGradient id="oGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#FBF7EE" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FBF7EE" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FBF7EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oAmb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FBF7EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FBF7EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sparse supporting stars across the canvas so the sky reads as a sky,
       not just one constellation. Kept fewer and smaller than the base
       starfield so they don't compete with showreel imagery. -->
  <g>
    <g><circle cx="120"  cy="80"  r="5" fill="url(#oAmb)"/><circle cx="120"  cy="80"  r="0.9" fill="#FFFFFF"/></g>
    <g><circle cx="320"  cy="160" r="7" fill="url(#oAmb)"/><circle cx="320"  cy="160" r="1.2" fill="#FFFFFF"/></g>
    <g><circle cx="540"  cy="100" r="9" fill="url(#oAmb)"/><circle cx="540"  cy="100" r="1.6" fill="#FFFFFF"/></g>
    <g><circle cx="760"  cy="190" r="5" fill="url(#oAmb)"/><circle cx="760"  cy="190" r="0.9" fill="#FFFFFF"/></g>
    <g><circle cx="960"  cy="60"  r="7" fill="url(#oAmb)"/><circle cx="960"  cy="60"  r="1.1" fill="#FFFFFF"/></g>
    <g><circle cx="1140" cy="220" r="6" fill="url(#oAmb)"/><circle cx="1140" cy="220" r="1.0" fill="#FFFFFF"/></g>
    <g><circle cx="220"  cy="420" r="5" fill="url(#oAmb)"/><circle cx="220"  cy="420" r="0.8" fill="#FFFFFF"/></g>
    <g><circle cx="420"  cy="540" r="6" fill="url(#oAmb)"/><circle cx="420"  cy="540" r="1.0" fill="#FFFFFF"/></g>
    <g><circle cx="680"  cy="500" r="5" fill="url(#oAmb)"/><circle cx="680"  cy="500" r="0.8" fill="#FFFFFF"/></g>
    <g><circle cx="900"  cy="620" r="7" fill="url(#oAmb)"/><circle cx="900"  cy="620" r="1.2" fill="#FFFFFF"/></g>
    <g><circle cx="1080" cy="500" r="5" fill="url(#oAmb)"/><circle cx="1080" cy="500" r="0.8" fill="#FFFFFF"/></g>
    <g><circle cx="1480" cy="380" r="6" fill="url(#oAmb)"/><circle cx="1480" cy="380" r="1.0" fill="#FFFFFF"/></g>
  </g>

  <!-- Southern Cross — same coordinates as base starfield, big and bright
       so it reads through the showreel overlay. Connector lines at higher
       opacity than the base SVG so the constellation shape is obvious. -->
  <g transform="translate(1320, 220)">
    <g stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" fill="none">
      <line x1="4"   y1="-66" x2="-9"  y2="84"/>
      <line x1="-55" y1="16"  x2="42"  y2="-4"/>
    </g>
    <circle cx="4"   cy="-66" r="16"  fill="url(#oGlow)"/>
    <circle cx="4"   cy="-66" r="3.0" fill="#FFFFFF"/>
    <circle cx="-55" cy="16"  r="18"  fill="url(#oGlow)"/>
    <circle cx="-55" cy="16"  r="3.4" fill="#FFFFFF"/>
    <circle cx="42"  cy="-4"  r="14"  fill="url(#oGlow)"/>
    <circle cx="42"  cy="-4"  r="2.6" fill="#FFFFFF"/>
    <circle cx="-9"  cy="84"  r="22"  fill="url(#oGlow)"/>
    <circle cx="-9"  cy="84"  r="4.2" fill="#FFFFFF"/>
    <circle cx="-22" cy="48"  r="10"  fill="url(#oGlow)"/>
    <circle cx="-22" cy="48"  r="1.8" fill="#FFFFFF"/>
  </g>
</svg>
